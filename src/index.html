<!-- impeccable-disable design-system-font, single-font -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jomla — Buy in groups. Pay wholesale.</title>
  <base href="/">
  <meta name="description" content="Jomla is a B2B group buying platform. Pool demand to unlock wholesale prices. Buyers save, sellers move volume.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="http://localhost:5174">
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F5F4EE;
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Static app shell — renders before Angular bootstraps, replaced on hydration -->
    <div id="app-shell" style="min-height:100vh;background:#F5F4EE;font-family:Inter,system-ui,sans-serif">

      <!-- Navbar skeleton -->
      <header style="position:sticky;top:0;z-index:100;background:#F5F4EE;border-bottom:1px solid #E5E3D9;height:60px;display:flex;align-items:center;padding:0 1.5rem">
        <div style="display:flex;align-items:center;gap:0.5rem">
          <div style="width:32px;height:32px;background:#0d9488;border-radius:8px;display:flex;align-items:center;justify-content:center">
            <img src="icons/jomla-icon-grouping.svg" alt="Jomla" width="32" height="32" fetchpriority="high" />
          </div>
          <span style="font-weight:700;font-size:1.125rem;color:#111827;letter-spacing:-0.01em">Jomla</span>
        </div>
      </header>

      <!-- Hero section -->
      <section style="padding:48px 1.5rem 64px;max-width:1200px;margin:0 auto">
        <div style="display:inline-flex;align-items:center;gap:0.5rem;background:rgba(13,148,136,0.1);color:#0d9488;padding:0.375rem 0.875rem;border-radius:9999px;font-size:0.875rem;font-weight:500;margin-bottom:1.5rem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          Wholesale prices, unlocked together
        </div>
        <h1 style="font-size:clamp(2.25rem,5vw,4rem);font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin:0 0 1.25rem;color:#111827">
          Buy in groups.<br><span style="color:#0d9488">Pay wholesale.</span>
        </h1>
        <p style="font-size:1.0625rem;color:#6B7280;line-height:1.6;margin:0 0 2rem;max-width:520px">
          Jomla pools B2B demand so you can unlock supplier volume discounts.<br>
          Join an active deal or post a request and let suppliers compete.
        </p>
        <div style="display:flex;gap:1rem;flex-wrap:wrap">
          <a href="/register/buyer" style="display:inline-flex;align-items:center;background:#0d9488;color:#fff;padding:0.75rem 1.75rem;border-radius:8px;font-weight:600;font-size:1rem;text-decoration:none">Start buying →</a>
          <a href="/register/supplier" style="display:inline-flex;align-items:center;border:2px solid #0d9488;color:#0d9488;padding:0.75rem 1.75rem;border-radius:8px;font-weight:600;font-size:1rem;text-decoration:none;background:transparent">Sell on Jomla</a>
        </div>
      </section>

    </div>
  </app-root>

</body>
</html>
